name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Test (CPU-only logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # 说明: 本包的核心依赖 torch/triton 体量很大, 在 CI 上安装成本高且不稳定.
      # 处理策略分两层:
      #   1) --no-deps 只装本包纯 Python 布局, 保证 import 路径可用;
      #   2) 尽力装 torch CPU 版, 失败不阻塞: conftest 的 gpu_available fixture
      #      对 torch import 是 try/except 安全的, 无 torch 时纯逻辑测试仍跑.
      - name: Install package (editable, no heavy deps)
        run: pip install -e ".[dev]" --no-deps

      - name: Install torch CPU (best-effort, optional)
        run: |
          pip install --pre torch --index-url https://download.pytorch.org/whl/cpu \
            || echo "::warning::torch CPU install failed — GPU/import-torch tests will be skipped"

      - name: Run CPU-only tests
        run: |
          pytest -m "not gpu and not redis and not slow" \
            --cov=kernelgym --cov-report=term-missing
