name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Test (CPU-only logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # Note: the core dependencies torch/triton are large and costly to install
      # in CI, and installs are often flaky. Strategy is two-layer:
      #   1) --no-deps installs only this package's pure-Python layout so import
      #      paths resolve;
      #   2) best-effort CPU-only torch install that never blocks the job: the
      #      gpu_available fixture in conftest wraps the torch import in
      #      try/except, so pure-logic tests still run without torch.
      # Test tooling must be installed separately: --no-deps also skips the
      # dependencies of the [dev] extra, which would leave `pytest` missing
      # (exit code 127) when the test step runs.
      - name: Install test tooling
        run: pip install pytest pytest-cov

      - name: Install package (editable, no heavy deps)
        run: pip install -e . --no-deps

      - name: Install torch CPU (best-effort, optional)
        run: |
          pip install --pre torch --index-url https://download.pytorch.org/whl/cpu \
            || echo "::warning::torch CPU install failed — GPU/import-torch tests will be skipped"

      - name: Run CPU-only tests
        run: |
          pytest -m "not gpu and not redis and not slow" \
            --cov=kernelgym --cov-report=term-missing
