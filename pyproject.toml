[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "king-triton-kernel"
version = "0.1.0"
description = "Caliber-disciplined evaluation toolkit and verifier-driven agent-RL framework for Triton kernel generation — reward execution correctness over compilation, with reference-timing discipline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "King.triton-kernel contributors" }]
keywords = ["triton", "kernel", "evaluation", "verifier", "kernel-generation", "cuda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.8",
    "triton>=3.4",
    "numpy",
    "fastapi",
    "uvicorn>=0.24",
    "pydantic>=2",
    "pydantic-settings",
    "redis",
    "aiohttp",
    "psutil",
]

[project.optional-dependencies]

# Evaluation tooling (evals/) aggregation scripts
eval = [
    "pandas",
    "pyarrow",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[project.scripts]
kernelgym-server = "kernelgym.server.api.server:main"
kernelgym-worker = "kernelgym.worker.gpu_worker:main"
kernelgym-worker-monitor = "kernelgym.worker.worker_monitor:main"
kernelgym-single-worker = "kernelgym.worker.single_worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kernelgym*"]
exclude = ["tests*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that execute kernels on a real NVIDIA GPU",
    "redis: integration tests that require a real redis instance",
    "slow: slow tests / tests that require the eval server",
]
addopts = "-m 'not gpu and not redis and not slow'"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["docs", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection calls `Depends(...)` in parameter defaults by design.
"kernelgym/server/api/*" = ["B008"]
# These modules must set env vars / guard optional imports (torch, triton) before
# importing worker-side modules, so imports cannot all sit at the top of the file.
"kernelgym/worker/gpu_worker.py" = ["E402"]
"kernelgym/worker/single_worker.py" = ["E402"]
"kernelgym/worker/worker_monitor.py" = ["E402"]
"kernelgym/workflow/kernelbench.py" = ["E402"]
"kernelgym/workflow/kernelbench_helpers.py" = ["E402"]
# `Backend.cleanup` is an intentionally optional no-op hook for subclasses.
"kernelgym/backend/base.py" = ["B027"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.coverage.run]
source = ["kernelgym"]
omit = ["*/__init__.py", "tests/*"]
